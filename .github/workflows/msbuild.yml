name: MSBuild

on:
  push:
    tags: "v*"
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  # Configuration type to build.
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    - name: Setup Cmake
      uses: lukka/get-cmake@latest
    - name: Restore artifacts, or setup vcpkg (do not install any package)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 703a8113f42e794534df5dfc5cece5dabcb949d0
    - name: Integrate vcpkg
      working-directory: ${{env.GITHUB_WORKSPACE}}/vcpkg
      run: ./vcpkg.exe integrate install --vcpkg-root ${{env.GITHUB_WORKSPACE}}/vcpkg
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /p:VcpkgEnableManifest=true /p:PostBuildEventUseInBuild=false
    - name: Remove build byproducts
      # Strip .pdb debug symbols and .cso shader blobs. The HLSL shaders are
      # embedded in the exe via generated headers (p_main/v_main), so the
      # standalone .cso files are redundant and shouldn't ship in the zip.
      shell: pwsh
      run: |
        Remove-Item build/x64/Release/*.pdb -ErrorAction SilentlyContinue
        Remove-Item build/x64/Release/*.cso -ErrorAction SilentlyContinue
    - name: Copy DLLs
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cp lib/Spout.dll build/x64/Release/
    - name: Copy License
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cp LICENSE build/x64/Release/
    - name: Save Folder
      uses: actions/upload-artifact@v4
      with:
        name: upload
        path: build/x64/Release/

  upload-release:

    runs-on: ubuntu-latest
    needs: [build]
    permissions: write-all

    steps:
    - uses: actions/checkout@v4
    - name: download artifacts
      uses: actions/download-artifact@v4
      with:
        name: upload
        path: upload
    - name: Generate PDF
      # Best-effort README->PDF for the bundle. md-to-pdf drives headless
      # Chromium, which needs --no-sandbox on ubuntu-latest (24.04 AppArmor
      # restricts unprivileged user namespaces). continue-on-error so a PDF
      # hiccup never blocks the release itself.
      continue-on-error: true
      run: |
        npm install -g md-to-pdf
        cat README.md | md-to-pdf --launch-options '{"args":["--no-sandbox"]}' > Instructions.pdf
        cp Instructions.pdf ./upload/
    - name: rename
      run: mv ./upload "./ZeroSpaceSpoutBridge-${{github.ref_name}}"
    - name: compress folder
      run: zip -r "./ZeroSpaceSpoutBridge-${{github.ref_name}}.zip" "./ZeroSpaceSpoutBridge-${{github.ref_name}}"
    - name: Create release and upload asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Built against disguise RenderStream RS3.0 headers.
        # Semver pre-release suffixes (e.g. v2.0.0-beta) publish as prereleases.
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: "./ZeroSpaceSpoutBridge-${{github.ref_name}}.zip"
    - name: Upload To Drive
      # Best-effort: skipped/soft-failed when DRIVE_CREDENTIALS/FOLDER_ID secrets
      # aren't configured, so the GitHub release still succeeds.
      continue-on-error: true
      uses: adityak74/google-drive-upload-git-action@v0.3
      with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: "./ZeroSpaceSpoutBridge-${{github.ref_name}}.zip"
          folderId: ${{ secrets.FOLDER_ID }}
          overwrite: "false"
